name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rbxfolio
          POSTGRES_PASSWORD: rbxfolio
          POSTGRES_DB: rbxfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://rbxfolio:rbxfolio@localhost:5432/rbxfolio
      BETTER_AUTH_SECRET: ci-test-secret-key-minimum-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      PORT: 3001
      UPLOAD_DIR: ./uploads

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate
      - run: pnpm db:push

      - run: pnpm --filter @rbxfolio/types test
      - run: pnpm lint
      - run: pnpm build
