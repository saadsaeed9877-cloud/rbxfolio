services:
  postgres:
    image: postgres:16-alpine
    container_name: rbxfolio-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: rbxfolio
      POSTGRES_PASSWORD: rbxfolio
      POSTGRES_DB: rbxfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rbxfolio -d rbxfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
